name: Deploy to GitHub Pages

# Runs on every push to main — including commits made by the CMS — so any
# content edit goes live automatically with no manual build step. The site
# is plain HTML/CSS/JS with content fetched at runtime from content/site.json,
# so there is nothing to compile; this workflow only publishes the files.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
